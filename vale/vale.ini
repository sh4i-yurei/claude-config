# Vale prose linter for the vault's posts. Runs from a PostToolUse hook whenever a post
# is written or edited, and by hand from the vault's root with
# `vale --config ~/Documents/claude-config/vale/vale.ini 30_Posts/<slug>.md`.
# Styles live under styles/, next to this file, and are tracked in git.
StylesPath = styles
MinAlertLevel = suggestion

Packages = ai-tells

[30_Posts/*.md]
BasedOnStyles = ai-tells, keepbreath
# Frontmatter and Obsidian image embeds are not prose.
BlockIgnores = (?s)^---\n.*?\n---\n, (?m)^!\[\[.*\]\]$

# Rules switched off for narrative posts. The pack targets reference documentation,
# and these fire on ordinary English about networks and processes: a connection
# that died, a session that dies with its shell, a server that sits behind a jump
# host, a laptop that reaches a box. Three-item sentences are also normal prose.
ai-tells.MortalityMetaphors = NO
ai-tells.BareReaches = NO
ai-tells.BareHolds = NO
ai-tells.FigurativeSits = NO
ai-tells.FigurativeLives = NO
ai-tells.FigurativeStays = NO
ai-tells.FigurativeKeeps = NO
ai-tells.FigurativeHolds = NO
ai-tells.FigurativeSettles = NO
ai-tells.VerbTricolon = NO
ai-tells.VerbTricolonDensity = NO
ai-tells.CataphoricForecasting = NO
ai-tells.NegatedObject = NO
ai-tells.EvasionMetaphors = NO
ai-tells.AnthropomorphicJustification = NO

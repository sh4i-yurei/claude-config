# Vale config for the vault sweep. Same styles and the same rule exclusions as
# .vale.ini, applied to every prose note rather than only to posts. Run by
# ~/.claude/skills/vault-sweep/scripts/sweep-check.py, or by hand from the vault's root
# with `vale --config ~/Documents/claude-config/vale/vale-sweep.ini <note>`.
StylesPath = styles
MinAlertLevel = suggestion

Packages = ai-tells

[*.md]
BasedOnStyles = ai-tells, keepbreath
# Frontmatter, Obsidian image embeds, Obsidian comment blocks and fenced code are
# not prose. Tables and Dataview blocks are structure, and so is a buildlog entry
# heading, whose `date — title` form comes from _Templates/buildlog-log.md.
BlockIgnores = (?s)^---\n.*?\n---\n, (?m)^!\[\[.*\]\]$, (?s)%%.*?%%, (?s)```.*?```, (?m)^\|.*\|$, (?m)^## \d{4}-\d{2}-\d{2}.*$

# Same exclusions as the posts config, for the same reasons: these rules target
# reference documentation and fire on ordinary English about networks and processes.
ai-tells.MortalityMetaphors = NO
ai-tells.BareReaches = NO
ai-tells.BareHolds = NO
ai-tells.FigurativeSits = NO
ai-tells.FigurativeLives = NO
ai-tells.FigurativeStays = NO
ai-tells.FigurativeKeeps = NO
ai-tells.FigurativeHolds = NO
ai-tells.FigurativeSettles = NO
ai-tells.VerbTricolon = NO
ai-tells.VerbTricolonDensity = NO
ai-tells.CataphoricForecasting = NO
ai-tells.NegatedObject = NO
ai-tells.EvasionMetaphors = NO
ai-tells.AnthropomorphicJustification = NO

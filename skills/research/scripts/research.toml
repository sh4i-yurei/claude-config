# B1 starting values. Phase 3 measures and tunes the survey and deep presets.
[gateway]
margin = 0.10
default_gap_multiplier = 10
default_gap_floor_s = 1
default_gap_ceiling_s = 120
daily_host_cap = 300
error_streak = 5
error_cooldown_s = 14400
max_attempts = 3
max_body_bytes = 5242880
default_backoff_base_s = 2
default_backoff_source = "gw.py: default PROVIDERS fallback and provider values"
user_agent = "keepbreath.ing-research/1.0 (+https://keepbreath.ing)"
contact_email = "" # Optional S2: set when Unpaywall or crates.io is needed.

[agent]
command = "claude"
working_directory = "vault"
disallowed_tools = ["WebFetch", "WebSearch", "Task"]
gather_tools = ["Read", "Grep", "Glob", "Edit", "Write", "lookup.py"]
check_tools = ["Read", "Grep", "Glob"]
write_tools = ["Read", "Edit", "Write"]

[presets.survey]
rounds = 1
calls = 15
cost_usd = 4
required_claims = 5
sources_per_claim = 1
source_floor = 3

[presets.deep]
rounds = 3
calls = 45
cost_usd = 15
required_claims = 12
sources_per_claim = 2
source_floor = 12

# Every direct API host in known-apis.md has an entry. "none documented"
# means that the gateway uses its default pacing.
[providers."crt.sh"]
minimum_gap_s = 0
gap_source = "known-apis.md: no limit documented"

[providers."api.osv.dev"]
minimum_gap_s = 0
gap_source = "known-apis.md: no limit documented"

[providers."services.nvd.nist.gov"]

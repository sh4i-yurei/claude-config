name: Python checks
on:
  push: {}
  pull_request: {}
permissions:
  contents: read
jobs:
  python:
    uses: sh4i-yurei/ci-workflows/.github/workflows/python.yml@8d1ea0f42d357f6639eda1ac9359b9b1420d8789
    with:
      caller_workflow: .github/workflows/ci.yml
      caller_job: python
      coverage_floor: 0
      install_command: |
        archive="$RUNNER_TEMP/gh_2.97.0_linux_amd64.tar.gz"
        curl -fsSL https://github.com/cli/cli/releases/download/v2.97.0/gh_2.97.0_linux_amd64.tar.gz -o "$archive"
        printf '%s  %s\n' a2c9b8497e1f85b1ad0dfcb78b5a622e098801b8e461e459e88e1ee12f018112 "$archive" | sha256sum --check -
        tar -xzf "$archive" -C "$RUNNER_TEMP"
        echo "$RUNNER_TEMP/gh_2.97.0_linux_amd64/bin" >> "$GITHUB_PATH"
        "$RUNNER_TEMP/gh_2.97.0_linux_amd64/bin/gh" --version
        python -m pip install PyYAML==6.0.3 pytest==9.1.1 pytest-cov==7.1.0

[tool.ruff]
extend-exclude = ["vendor/bashlex"]
force-exclude = true

[tool.mutmut]
source_paths = ["hooks", "tools", "skills/research", "skills/vault-query", "skills/vault-sweep"]
also_copy = ["vendor", "README.md", ".github", "rules", "skills/project-note", ".mutation-survivors.yml"]
pytest_add_cli_args_test_selection = ["tests"]
cache_invalidation_files = ["tests/*.py", "tests/**/*.py", "vendor/**/*.py"]
on_dependency_change = "rerun"

[tool.pytest.ini_options]
testpaths = ["tests"]
